version: "3.9"

services:
  db:
    image: postgres:18
    container_name: cashier_db
    restart: always
    labels:
      autoheal: "true"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_CIDRS: ${POSTGRES_REPLICATION_CIDRS:-samenet}
      REPORTS_DB_USER: ${REPORTS_DB_USER}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=${POSTGRES_WAL_KEEP_SIZE:-1024MB}
      - -c
      - hot_standby=on
    volumes:
      - postgres_18_data:/var/lib/postgresql
      - ./devops/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-replica-1:
    image: postgres:18
    container_name: cashier_db_replica_1
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_CIDRS: ${POSTGRES_REPLICATION_CIDRS:-samenet}
    entrypoint: ["/usr/local/bin/setup-postgres-replica.sh"]
    volumes:
      - postgres_18_replica_1:/var/lib/postgresql
      - ./devops/postgres-replica/setup-postgres-replica.sh:/usr/local/bin/setup-postgres-replica.sh:ro
    ports:
      - "127.0.0.1:${DB_REPLICA_1_PORT:-5433}:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_REPLICATION_USER -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
  
    volumes:
      - ./staticfiles:/app/staticfiles

    command: >
      sh -c "
      uv run python manage.py makemigrations &&
      uv run python manage.py migrate &&
      uv run python manage.py collectstatic --noinput &&
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      BACKEND_INSTANCE: backend-1
      DB_HOST: db

    # optional but recommended
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s

  backend-2:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend_2
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ./staticfiles:/app/staticfiles

    command: >
      sh -c "
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "

    ports:
      - "8001:8000"

    env_file:
      - .env
    environment:
      BACKEND_INSTANCE: backend-2
      DB_HOST: db

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s

  backend-3:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend_3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ./staticfiles:/app/staticfiles

    command: >
      sh -c "
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "

    ports:
      - "8002:8000"

    env_file:
      - .env
    environment:
      BACKEND_INSTANCE: backend-3
      DB_HOST: db

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s

  reports:
    image: ghcr.io/fedal-nl/cashier_reports:latest
    container_name: cashier_reports
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      REPORTS_DB_NAME: ${DB_NAME}
      REPORTS_DB_USER: ${REPORTS_DB_USER}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD}
      REPORTS_DB_HOST: db
      REPORTS_DB_PORT: ${DB_PORT:-5432}

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: cashier_autoheal
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Watches all backend Docker health statuses. If any API instance becomes
  # unhealthy, restart Postgres first and then all backend instances, because
  # some API outages only recovered after the full API/database group restarted.
  api-stack-autoheal:
    image: docker:27-cli
    container_name: cashier_api_stack_autoheal
    restart: always
    depends_on:
      - backend
      - backend-2
      - backend-3
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DB_CONTAINER: cashier_db
      BACKEND_CONTAINERS: cashier_backend cashier_backend_2 cashier_backend_3
      CHECK_INTERVAL: 30
      RESTART_COOLDOWN: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Poll the backend health statuses through Docker. If any backend is unhealthy,
    # restart DB -> wait briefly -> restart all backends -> wait before checking again.
    command: >
      sh -c '
      while true; do
        unhealthy="";
        for container in $$BACKEND_CONTAINERS; do
          status="$$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" "$$container" 2>/dev/null || echo missing)";
          if [ "$$status" = "unhealthy" ]; then
            unhealthy="$$container";
            break;
          fi;
        done;
        if [ -n "$$unhealthy" ]; then
          echo "$$(date -Iseconds) $$unhealthy is unhealthy. Restarting $$DB_CONTAINER, then $$BACKEND_CONTAINERS.";
          docker restart "$$DB_CONTAINER";
          sleep 10;
          docker restart $$BACKEND_CONTAINERS;
          echo "$$(date -Iseconds) Restart completed. Cooling down for $$RESTART_COOLDOWN seconds.";
          sleep "$$RESTART_COOLDOWN";
        else
          sleep "$$CHECK_INTERVAL";
        fi;
      done
      '

volumes:
  postgres_18_data:
  postgres_18_replica_1:
