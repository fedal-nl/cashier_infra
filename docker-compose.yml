version: "3.9"

services:
  db:
    image: postgres:18
    container_name: cashier_db
    restart: always
    environment:
      POSTGRES_DB: cashier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-cashier_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-cashier_replicator}
      REPORTS_DB_USER: ${REPORTS_DB_USER:-cashier_readonly}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:-cashier_readonly}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=512MB
      - -c
      - hot_standby=on
    volumes:
      - postgres_18_restored:/var/lib/postgresql
      - ./devops/postgres-init-dev/00-restore-cashier-backup.sh:/docker-entrypoint-initdb.d/00-restore-cashier-backup.sh:ro
      - ./devops/postgres-init-dev/01-create-replication-user.sh:/docker-entrypoint-initdb.d/01-create-replication-user.sh:ro
      - ./devops/postgres-init/01-create-reporting-user.sh:/docker-entrypoint-initdb.d/01-create-reporting-user.sh:ro
      - ./backup_cashier_20260705_130001.dump:/docker-entrypoint-initdb.d/backup_cashier_20260705_130001.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-replica-1:
    image: postgres:18
    container_name: cashier_db_replica_1
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-cashier_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-cashier_replicator}
      POSTGRES_REPLICATION_CIDRS: all
    entrypoint: ["/usr/local/bin/setup-postgres-replica.sh"]
    volumes:
      - postgres_18_replica_1:/var/lib/postgresql
      - ./devops/postgres-replica/setup-postgres-replica.sh:/usr/local/bin/setup-postgres-replica.sh:ro
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_REPLICATION_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-replica-2:
    image: postgres:18
    container_name: cashier_replica_etl
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      PRIMARY_HOST: db-replica-1
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-cashier_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-cashier_replicator}
      POSTGRES_REPLICATION_CIDRS: all
    entrypoint: ["/usr/local/bin/setup-postgres-replica.sh"]
    volumes:
      - postgres_18_replica_2:/var/lib/postgresql
      - ./devops/postgres-replica/setup-postgres-replica.sh:/usr/local/bin/setup-postgres-replica.sh:ro
    ports:
      - "127.0.0.1:5434:5432"
    depends_on:
      db-replica-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_REPLICATION_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend
    labels:
      autoheal: "true"
    command: >
      sh -c "
      uv run python manage.py makemigrations &&
      uv run python manage.py migrate &&
      uv run python manage.py collectstatic --noinput &&
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - backend_venv:/app/.venv
    env_file: 
      - .env
    environment:
      BACKEND_INSTANCE: backend-1
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend-2:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend_2
    labels:
      autoheal: "true"
    command: >
      sh -c "
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - backend_venv:/app/.venv
    env_file:
      - .env
    environment:
      BACKEND_INSTANCE: backend-2
    depends_on:
      db:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend-3:
    image: ghcr.io/fedal-nl/cashier_backend_api:latest
    container_name: cashier_backend_3
    labels:
      autoheal: "true"
    command: >
      sh -c "
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 30 --max-requests 1000 --max-requests-jitter 100
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - backend_venv:/app/.venv
    env_file:
      - .env
    environment:
      BACKEND_INSTANCE: backend-3
    depends_on:
      db:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    # image: ghcr.io/fedal-nl/cashier_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cashier_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    #ports:
    #  - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host"
    stdin_open: true
    tty: true
    env_file:
      - .env

  website:
    build:
      context: ./aklahlana-website
      dockerfile: Dockerfile.dev
    container_name: aklahlana_website
    volumes:
      - ./aklahlana-website:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    stdin_open: true
    tty: true
    env_file:
      - .env

  reports:
    build:
      context: ./cashier-reports
      dockerfile: Dockerfile
    container_name: cashier_reports
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./cashier-reports:/app
    environment:
      REPORTS_DB_NAME: ${DB_NAME:-cashier}
      REPORTS_DB_USER: ${REPORTS_DB_USER:-cashier_readonly}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:-cashier_readonly}
      REPORTS_DB_HOST: db
      REPORTS_DB_PORT: ${DB_PORT:-5432}
    depends_on:
      - db

  cashier-etl:
    build:
      context: ./cashier-etl
      dockerfile: Dockerfile
    container_name: cashier_etl
    restart: unless-stopped
    env_file:
      - ./cashier-etl/.env
    command: >
      sh -c 'while true; do
        python src/main.py;
        sleep "$${ETL_INTERVAL_SECONDS:-300}";
      done'
    volumes:
      - ./cashier-etl/src:/app/src
    depends_on:
      db-replica-2:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cashier_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
    depends_on:
      - backend
      - backend-2
      - backend-3
      - frontend
      - website
      - reports

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: cashier_autoheal
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_18_restored:
  postgres_18_replica_1:
  postgres_18_replica_2:
  static_volume:
  backend_venv:
